name: Release on PR Merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    name: Conventional Commits Release & Build
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          $maxRetries = 3
          $delay = 10
          $success = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Installing Python dependencies (attempt $i of $maxRetries)..."
            python -m pip install --upgrade pip
            if ($LASTEXITCODE -eq 0) {
              pip install -r requirements.txt
              if ($LASTEXITCODE -eq 0) {
                $success = $true
                Write-Host "Python dependencies installed successfully."
                break
              }
            }
            if ($i -lt $maxRetries) {
              Write-Warning "Attempt $i failed. Retrying in $delay seconds..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "Failed to install Python dependencies after $maxRetries attempts."
            exit 1
          }

      - name: Analyze Conventional Commits & Determine Version
        id: semver
        run: |
          python scripts/release_helper.py --event-path "$env:GITHUB_EVENT_PATH" --output-file "$env:GITHUB_OUTPUT" --changelog-file "changelog.md" --update-scroll

      - name: Log Release Decision
        run: |
          Write-Host "Should Release: ${{ steps.semver.outputs.should_release }}"
          if ("${{ steps.semver.outputs.should_release }}" -eq "true") {
            Write-Host "New Version: ${{ steps.semver.outputs.version }}"
            Write-Host "Tag Name: ${{ steps.semver.outputs.tag_name }}"
            Write-Host "Bump Type: ${{ steps.semver.outputs.bump_type }}"
            Write-Host "Previous Tag: ${{ steps.semver.outputs.previous_tag }}"
            Write-Host "Release Title: ${{ steps.semver.outputs.release_title }}"
            Write-Host "--- Updated texts/scroll.txt ---"
            Get-Content -Path "texts/scroll.txt"
            Write-Host "--- Changelog Preview ---"
            Get-Content -Path "changelog.md"
          } else {
            Write-Host "Skipping release: No releasing conventional commit types (feat/fix/breaking) found."
          }

      - name: Install GNU Make
        if: steps.semver.outputs.should_release == 'true'
        run: |
          $maxRetries = 3
          $delay = 10
          $success = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Installing GNU Make via Chocolatey (attempt $i of $maxRetries)..."
            choco install make -y
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($i -lt $maxRetries) {
              Write-Warning "Attempt $i to install make failed. Retrying in $delay seconds..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "Failed to install GNU Make after $maxRetries attempts."
            exit 1
          }

      - name: Install Mad-Assembler (MADS)
        if: steps.semver.outputs.should_release == 'true'
        run: |
          $madsDir = "C:\Apps\Mad-Assembler-2.1.6\bin\windows_x86_64"
          New-Item -ItemType Directory -Force -Path $madsDir | Out-Null
          curl.exe --retry 3 --retry-delay 5 -L -f -s -S "https://raw.githubusercontent.com/tebe6502/Mad-Assembler/2.1.6/bin/windows_x86_64/mads.exe" -o "$madsDir\mads.exe"
          if (!(Test-Path "$madsDir\mads.exe")) { throw "MADS download failed" }

      - name: Build Atari XEX
        if: steps.semver.outputs.should_release == 'true'
        run: |
          make all
          if (!(Test-Path "jabberwocky.xex")) {
            Write-Error "Build failed: jabberwocky.xex was not generated!"
            exit 1
          }
          Write-Host "Successfully built jabberwocky.xex (`$((Get-Item jabberwocky.xex).Length) bytes)"

      - name: Run Tests
        if: steps.semver.outputs.should_release == 'true'
        run: |
          make test

      - name: Commit & Push updated scroll.txt to main
        if: steps.semver.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add texts/scroll.txt
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore(release): bump scroll.txt version to ${{ steps.semver.outputs.version }} [skip ci]"
            $maxRetries = 3
            $delay = 5
            $pushed = $false
            for ($i = 1; $i -le $maxRetries; $i++) {
              git push origin HEAD:main
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                break
              }
              if ($i -lt $maxRetries) {
                Write-Warning "Push failed (attempt $i). Pulling rebase and retrying in $delay seconds..."
                git pull --rebase origin main
                Start-Sleep -Seconds $delay
              }
            }
            if (-not $pushed) {
              Write-Error "Failed to push updated scroll.txt to main after $maxRetries attempts."
              exit 1
            }
          } else {
            Write-Host "No changes in texts/scroll.txt to commit."
          }

      - name: Create GitHub Release
        if: steps.semver.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag_name }}
          name: ${{ steps.semver.outputs.release_title }}
          body_path: changelog.md
          files: |
            jabberwocky.xex
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
