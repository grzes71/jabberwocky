name: Deploy Game Portal to GitHub Pages

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Minimal workflow-level permissions
permissions:
  contents: read

# Concurrency to prevent overlapping Pages deployments
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: Build Binary, Data & Static Portal
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          $maxRetries = 3
          $delay = 10
          $success = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Installing Python dependencies (attempt $i of $maxRetries)..."
            python -m pip install --upgrade pip
            if ($LASTEXITCODE -eq 0) {
              pip install -r requirements.txt
              if ($LASTEXITCODE -eq 0) {
                $success = $true
                Write-Host "Python dependencies installed successfully."
                break
              }
            }
            if ($i -lt $maxRetries) {
              Write-Warning "Attempt $i failed. Retrying in $delay seconds..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "Failed to install Python dependencies after $maxRetries attempts."
            exit 1
          }

      - name: Install GNU Make
        run: |
          $maxRetries = 3
          $delay = 10
          $success = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Installing GNU Make via Chocolatey (attempt $i of $maxRetries)..."
            choco install make -y
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($i -lt $maxRetries) {
              Write-Warning "Attempt $i to install make failed. Retrying in $delay seconds..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "Failed to install GNU Make after $maxRetries attempts."
            exit 1
          }

      - name: Install Mad-Assembler (MADS)
        run: |
          $madsDir = "C:\Apps\Mad-Assembler-2.1.6\bin\windows_x86_64"
          New-Item -ItemType Directory -Force -Path $madsDir | Out-Null
          curl.exe --retry 3 --retry-delay 5 -L -f -s -S "https://raw.githubusercontent.com/tebe6502/Mad-Assembler/2.1.6/bin/windows_x86_64/mads.exe" -o "$madsDir\mads.exe"
          if (!(Test-Path "$madsDir\mads.exe")) { throw "MADS download failed" }

      - name: Build Atari XEX & Memory Map
        run: |
          make all
          if (!(Test-Path "jabberwocky.xex")) {
            Write-Error "Build failed: jabberwocky.xex was not generated!"
            exit 1
          }

      - name: Generate Portal JSON Data
        run: make portal_data

      - name: Validate Portal Data & Schemas
        run: python -m pytest tests/test_portal_data.py -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install Node dependencies
        working-directory: website
        run: |
          $maxRetries = 3
          $delay = 10
          $success = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Installing Node dependencies via npm ci (attempt $i of $maxRetries)..."
            npm ci
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              Write-Host "Node dependencies installed successfully."
              break
            }
            if ($i -lt $maxRetries) {
              Write-Warning "npm ci failed (attempt $i). Retrying in $delay seconds..."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $success) {
            Write-Error "Failed to install Node dependencies after $maxRetries attempts."
            exit 1
          }

      - name: Run Astro Type Diagnostics
        working-directory: website
        run: npm run check

      - name: Build Static Site with Astro
        working-directory: website
        run: npm run build
        env:
          ASTRO_BASE_URL: '/jabberwocky'

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

